name: Rebuild lab02 presentation matching report images

on:
  push:
    paths:
      - ".github/workflows/rebuild-lab02-presentation-sync-images-temp.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pandoc texlive-xetex texlive-latex-extra texlive-fonts-recommended texlive-lang-cyrillic fonts-paratype

      - name: Make presentation images identical to report images
        run: |
          rm -rf lab02/presentation/image
          cp -a lab02/report/image lab02/presentation/image

      - name: Build presentation
        working-directory: lab02/presentation
        run: |
          pandoc -t beamer presentation.md -V theme:metropolis -o presentation.pdf --pdf-engine=xelatex
          pandoc -s -t revealjs --slide-level=2 --embed-resources -V revealjs-url=https://unpkg.com/reveal.js@4.6.1 presentation.md -o presentation.html

      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A lab02/presentation/image lab02/presentation/presentation.pdf lab02/presentation/presentation.html
          git commit -m "build: sync lab 2 presentation images with report" || exit 0
          git push
