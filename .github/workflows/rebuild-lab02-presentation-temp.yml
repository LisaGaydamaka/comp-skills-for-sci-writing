name: Rebuild lab02 presentation with images

on:
  push:
    paths:
      - ".github/workflows/rebuild-lab02-presentation-temp.yml"
      - "lab02/presentation/presentation.md"
      - "lab02/presentation/image/**"
      - "lab02/report/image/**"

permissions:
  contents: write

jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pandoc texlive-xetex texlive-latex-extra texlive-fonts-recommended texlive-lang-cyrillic fonts-paratype

      - name: Copy report images as fallback
        working-directory: lab02/presentation
        run: |
          mkdir -p image
          shopt -s nullglob
          for f in ../report/image/*; do
            name=$(basename "$f" | tr '[:upper:]' '[:lower:]')
            cp -f "$f" "image/$name"
          done

      - name: Build presentation
        working-directory: lab02/presentation
        run: |
          pandoc -t beamer presentation.md -V theme:metropolis -o presentation.pdf --pdf-engine=xelatex
          pandoc -s -t revealjs --slide-level=2 --embed-resources -V revealjs-url=https://unpkg.com/reveal.js@4.6.1 presentation.md -o presentation.html

      - name: Commit generated files and copied images
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lab02/presentation/image lab02/presentation/presentation.pdf lab02/presentation/presentation.html
          git commit -m "build: rebuild lab 2 presentation with images" || exit 0
          git push
